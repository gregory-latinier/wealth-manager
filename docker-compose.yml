name: wealth-manager

# Development stack: PostgreSQL only. The server and client run on the host via pnpm.
# Start with: pnpm dev:db
# Host port 5433 (not 5432) so it does not clash with another local PostgreSQL.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wmuser
      POSTGRES_PASSWORD: wmpassword
      POSTGRES_DB: wealthmanager
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wmuser -d wealthmanager"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
